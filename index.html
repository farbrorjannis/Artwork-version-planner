<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Artwork Version Planner</title>

<style>
:root {
  --bg-page: #f7f3ea;
  --bg-card: #efefec;
  --bg-panel: #e6e6e4;
  --primary-brown: #5b4a3a;
  --text-main: #2f2f2f;
  --text-muted: #6f6f6b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--bg-page);
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--text-main);
}

.card {
  max-width: 960px;
  margin: 0 auto;
  background: var(--bg-card);
  border-radius: 18px;
  padding: 16px;
}

header h1 {
  margin: 0;
  font-size: 1.4rem;
}

header p {
  margin: 6px 0 12px;
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* Upload */
.upload {
  text-align: center;
  margin-bottom: 12px;
}

.upload input {
  display: none;
}

.upload label {
  display: inline-block;
  padding: 10px 18px;
  background: var(--primary-brown);
  color: white;
  border-radius: 999px;
  font-size: 0.9rem;
  cursor: pointer;
}

/* Preview container */
.preview-container {
  width: 100%;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  display: none; /* shown after upload */
}

/* Canvas fills container */
.preview-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Controls (placeholder for next steps) */
.note {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-align: center;
}
</style>
</head>

<body>

<div class="card">
  <header>
    <h1>Artwork Version Planner</h1>
    <p>Preview artwork with correct proportions for web and social media</p>
  </header>

  <div class="upload">
    <label>
      Upload artwork
      <input type="file" id="upload" accept="image/*" />
    </label>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="preview-container">
    <canvas id="canvas"></canvas>
  </div>

  <p class="note">
    The preview area adapts to the artwork’s original proportions.
  </p>
</div>

<script>
const uploadInput = document.getElementById("upload");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let image = new Image();

uploadInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  image.onload = () => {
    applyAspectRatio(image.width, image.height);
    drawImageScaled();
  };

  image.src = URL.createObjectURL(file);
});

function applyAspectRatio(width, height) {
  const ratio = width / height;

  /* 1. Let the container adapt to artwork proportions */
  preview.style.aspectRatio = ratio;

  /* 2. Show preview once ratio is known */
  preview.style.display = "block";

  /* 3. Set canvas internal resolution */
  canvas.width = width;
  canvas.height = height;
}

function drawImageScaled() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
}
</script>

</body>
</html>
